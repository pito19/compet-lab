[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compet-lab"
version = "1.0.0"
description = "COMPET LAB -- Modern Competition Management & Operations (V1)"
requires-python = ">=3.12"
dependencies = [
    # FastAPI pinned: release 0.141.1 (2026-07-29) verified against the official release notes.
    "fastapi==0.141.1",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pyjwt>=2.9,<3",
    "passlib>=1.7.4,<2",
    # passlib 1.7.x is incompatible with bcrypt >= 4.1 (broken version introspection) -> keep 4.0.x
    "bcrypt==4.0.1",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() are meant to be called as default argument
# values -- this is idiomatic, not the mutable-default-argument bug B008
# normally guards against.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
