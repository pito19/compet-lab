services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: compet
      POSTGRES_PASSWORD: compet
      POSTGRES_DB: compet_lab
    ports:
      - "5432:5432"
    volumes:
      - compet_lab_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compet -d compet_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://compet:compet@postgres:5432/compet_lab
      CORS_ORIGINS: '["http://localhost:4200"]'
      JWT_SECRET: dev-only-jwt-secret-change-me-before-any-real-deployment
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  compet_lab_pg_data:
