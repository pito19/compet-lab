# SonarCloud project configuration.
# Prerequisite (not doable from here): create a SonarCloud account,
# import this GitHub repo as a project, then add SONAR_TOKEN (and
# SONAR_ORGANIZATION if it differs from the placeholder below) as a
# repository secret in GitHub Settings > Secrets and variables > Actions.

sonar.organization=CHANGE-ME-sonarcloud-org
sonar.projectKey=CHANGE-ME-sonarcloud-project-key
sonar.projectName=COMPET LAB

# Two languages in one project: point Sonar at both source trees and
# let it auto-detect Python vs TypeScript per file.
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/.angular/**,**/alembic/versions/**,**/__pycache__/**

# Backend coverage: produced by `pytest --cov=app --cov-report=xml` (see ci.yml).
sonar.python.coverage.reportPaths=backend/coverage.xml

# Frontend: no unit tests exist yet (see README backlog), so no JS/TS
# coverage report is wired in. Sonar will still analyse code smells,
# duplication and maintainability for the Angular source without a
# coverage metric until frontend unit tests are added.
sonar.python.version=3.12
